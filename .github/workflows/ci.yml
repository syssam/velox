name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velox
          POSTGRES_PASSWORD: velox
          POSTGRES_DB: velox
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U velox -d velox" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: velox
          MYSQL_DATABASE: velox
          MYSQL_USER: velox
          MYSQL_PASSWORD: velox
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uvelox -pvelox" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      VELOX_TEST_POSTGRES: postgres://velox:velox@127.0.0.1:55432/velox?sslmode=disable
      VELOX_TEST_MYSQL: velox:velox@tcp(127.0.0.1:53306)/velox?parseTime=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go test -race -count=1 ./...
