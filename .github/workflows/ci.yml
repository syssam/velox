name: CI
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
# A new push to a pull request replaces its run; main's runs all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The jobs run at once. Only test needs the databases, and only it runs on both
# PostgreSQL versions; the others do not depend on the version and run once.
# scripts/ci-local.sh runs the same commands, in lanes of the same shape and
# levels: a job or step without an if is the merge gate's and always runs; one
# on a push only is --full's; one on a pull request only is the merge gate's
# form of a --full check; one on a changes output runs on a push, and on a pull
# request that touches its group (scripts/ci-changes.sh).
#
# Each job keeps its build and module caches under a key of its own, so that
# the tools it builds with go run, golangci-lint, govulncheck and revive,
# and its packages, come from its last run rather than from whichever job
# saved setup-go's one shared cache first.
jobs:
  # The groups beyond the ORM's that the run checks: all of them on a push, and
  # on a pull request those its files touch.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      graphql: ${{ steps.groups.outputs.graphql }}
      otel: ${{ steps.groups.outputs.otel }}
      bench: ${{ steps.groups.outputs.bench }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the pull request's base, which ci-changes.sh compares with
      # ci-changes.sh derives each group's files with go list.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - id: groups
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            groups=" $(scripts/ci-changes.sh "$BASE" | tr '\n' ' ')"
          else
            groups=" graphql otel bench "
          fi
          echo "groups:$groups"
          for g in graphql otel bench; do
            case $groups in *" $g "*) v=true ;; *) v=false ;; esac
            echo "$g=$v" >> "$GITHUB_OUTPUT"
          done
  # gofmt, tidiness, vet, govulncheck and the linters of the root and the
  # examples.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - name: examples
        working-directory: examples
        run: |
          go mod tidy -diff
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
          # golangci-lint's revive skips generated files; revive itself lints velox-gen's.
          go run github.com/mgechev/revive@v1.17.0 -config ../scripts/revive.toml -set_exit_status ./*/veloxgen
  # The tests, on each PostgreSQL version: the ORM's always, and the groups'
  # when they run. A push measures coverage and checks it against the
  # per-package floors at the end (scripts/coverage-floors.txt).
  test:
    name: test (PostgreSQL ${{ matrix.pg }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "14"
            postgres-image: postgres:14@sha256:8ab94f61668dc73bbab4dc13273ff2fc37e635536af62aef5306a49a9682a446
            test-timeout: 40m # the migrate package alone took up to 19m on a loaded Mac
          - pg: "18"
            postgres-image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
            test-timeout: 20m
    runs-on: ubuntu-latest
    # Above the test-timeout and the other steps, so that go test's own timeout
    # fires, and prints its goroutines, before the job is killed.
    timeout-minutes: 90
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_USER: velox
          POSTGRES_PASSWORD: velox
          POSTGRES_DB: velox
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U velox -d velox" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: velox
          MYSQL_DATABASE: velox
          MYSQL_USER: velox
          MYSQL_PASSWORD: velox
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uvelox -pvelox" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      VELOX_TEST_POSTGRES: postgres://velox:velox@127.0.0.1:55432/velox?sslmode=disable
      VELOX_TEST_MYSQL: velox:velox@tcp(127.0.0.1:53306)/velox?parseTime=true&clientFoundRows=true
      # The root DSN: the routing tests make databases beside the CI one (PostgreSQL's velox can; MySQL's cannot).
      VELOX_TEST_MYSQL_ADMIN: root:velox@tcp(127.0.0.1:53306)/?parseTime=true&clientFoundRows=true
      # The itests fail, rather than skip, when a database variable is unset.
      VELOX_ITEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      # The tests build modules offline, with gqlgen as a tool: they need the whole
      # module graph, which go mod download without all leaves out. The lint job
      # checks tidiness; download all dirties go.sum, and the tidy after it
      # restores it.
      - run: |
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
      - name: root
        if: github.event_name == 'pull_request'
        run: go test -race -count=1 -timeout ${{ matrix.test-timeout }} -skip '^(TestGraphQLServiceLinksOnlyItsEntities|TestScaleHarnessSmallGraphQL)$' ./...
      - name: root, with coverage
        if: github.event_name == 'push'
        run: go test -race -count=1 -timeout ${{ matrix.test-timeout }} -coverpkg=./... -coverprofile=cover-root.out -skip '^(TestGraphQLServiceLinksOnlyItsEntities|TestScaleHarnessSmallGraphQL)$' ./...
      - name: examples
        working-directory: examples
        run: go test -race -count=1 -coverprofile="$GITHUB_WORKSPACE/cover-examples.out" $(go list ./... | grep -vE '/examples/(graphql|otel)(/|$)')
      - name: contrib/veloxotel
        if: needs.changes.outputs.otel == 'true'
        working-directory: contrib/veloxotel
        run: go test -race -count=1 -coverprofile="$GITHUB_WORKSPACE/cover-veloxotel.out" ./...
      - name: examples/otel
        if: needs.changes.outputs.otel == 'true'
        working-directory: examples
        run: go test -race -count=1 -coverprofile="$GITHUB_WORKSPACE/cover-examples-otel.out" ./otel/...
      # The annotations package, the velox-graphql plugin and the runtime. Its
      # mutation and collection itests (TestMutationsRun, TestCollectRun) run on
      # SQLite, and on PostgreSQL and MySQL under the job's VELOX_TEST_POSTGRES
      # and VELOX_TEST_MYSQL.
      - name: contrib/graphql
        if: needs.changes.outputs.graphql == 'true'
        working-directory: contrib/graphql
        run: |
          # The collection integration test builds an application offline, with gqlgen as a tool.
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
          go test -race -count=1 -coverprofile="$GITHUB_WORKSPACE/cover-graphql.out" ./...
      - name: examples/graphql
        if: needs.changes.outputs.graphql == 'true'
        working-directory: examples
        run: go test -race -count=1 -timeout 20m -coverprofile="$GITHUB_WORKSPACE/cover-examples-graphql.out" ./graphql/...
      - name: coverage floors
        if: github.event_name == 'push'
        run: go run ./scripts/covfloor -floors scripts/coverage-floors.txt cover-root.out cover-root-graphql.out cover-examples.out cover-examples-graphql.out cover-examples-otel.out cover-veloxotel.out cover-graphql.out
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - name: fuzz (short)
        run: |
          go test -run XXX -fuzz '^FuzzRender$' -fuzztime 20s ./internal/engine
          go test -run XXX -fuzz '^FuzzQuote$' -fuzztime 10s ./internal/engine
          go test -run XXX -fuzz '^FuzzScope$' -fuzztime 10s ./internal/engine
          go test -run XXX -fuzz '^FuzzLiteral$' -fuzztime 10s ./internal/ddl
          go test -run XXX -fuzz '^FuzzSplit$' -fuzztime 10s ./migrate
          go test -run XXX -fuzz '^FuzzRenderWrite$' -fuzztime 10s ./internal/engine
          go test -run XXX -fuzz '^FuzzConstraint$' -fuzztime 10s ./internal/dberr
          go test -run XXX -fuzz '^FuzzDiff$' -fuzztime 10s ./migrate
          go test -run XXX -fuzz '^FuzzColumnScan$' -fuzztime 10s ./internal/conn
  # velox-gen's output is current and valid, in the root and in every example
  # but examples/graphql (the graphql job's), and the examples' migrations
  # replay.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - name: generated files are current and every entity is valid
        run: |
          go build -o bin/velox-gen ./cmd/velox-gen
          bin/velox-gen -check -out internal/testmodel -package testmodel ./internal/testmodel/schema
          bin/velox-gen verify -out internal/testmodel ./internal/testmodel/schema
          bin/velox-gen -check -out internal/testbind -package testbind ./internal/testbind/schema
          bin/velox-gen verify -out internal/testbind ./internal/testbind/schema
          # golangci-lint's revive skips generated files; revive itself lints velox-gen's.
          go run github.com/mgechev/revive@v1.17.0 -config scripts/revive.toml -set_exit_status ./internal/testmodel ./internal/testbind
      - name: examples
        working-directory: examples
        run: |
          for d in */veloxschema; do
            x=${d%/veloxschema}
            [ "$x" = graphql ] && continue # the graphql job's, with the plugin
            go tool velox-gen -check -out "./$x/veloxgen" "./$x/veloxschema"
            go tool velox-gen verify -out "./$x/veloxgen" "./$x/veloxschema"
          done
          # Each example's tables come from its committed migrations: fail on drift from the
          # schema package, and on SQL that does not replay to its schema.json (applied to a
          # temporary SQLite file, then compared with drift).
          migdb=$(mktemp -d)
          for f in */migrations/schema.json */migrations/sqlite/schema.json; do
            d=${f%/schema.json}
            x=${d%%/*}
            go tool velox-gen migrate diff -check -dir "./$d" "./$x/veloxschema"
            go tool velox-gen migrate apply -dir "./$d" -db "$migdb/$x.db"
            go tool velox-gen migrate drift -dir "./$d" -db "$migdb/$x.db"
          done
          rm -rf "$migdb"
          # tracker's PostgreSQL migrations: its tests apply them, under VELOX_TEST_POSTGRES.
          go tool velox-gen migrate diff -check -dir ./tracker/migrations/postgres ./tracker/veloxschema
  # velox's own build cost, report-only here until a Linux run recalibrates
  # thresholds.json, which was measured on darwin/arm64 only. A run that fails
  # still fails the step.
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      # bench/scale builds offline: it needs the whole module graph, as the
      # test job does.
      - run: |
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
      - name: scale (n=500, report-only)
        run: scripts/scale-check.sh -n 500 -s 100
  # contrib/graphql's checks, its fuzz target, examples/graphql's generated
  # files and gqlgen's output, and bench/scale with GraphQL.
  graphql:
    needs: changes
    if: needs.changes.outputs.graphql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - run: |
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
      - name: contrib/graphql
        working-directory: contrib/graphql
        run: |
          go mod tidy -diff
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
          go test -run XXX -fuzz '^FuzzCost$' -fuzztime 10s ./veloxgql/internal/cost
          go test -run XXX -fuzz '^FuzzLegacyCursor$' -fuzztime 10s ./veloxgql/internal/gqlcore
      - name: examples/graphql
        working-directory: examples
        run: |
          go tool velox-gen -check -out ./graphql/veloxgen -plugin velox-graphql ./graphql/veloxschema
          go tool velox-gen verify -out ./graphql/veloxgen -plugin velox-graphql ./graphql/veloxschema
          # gqlgen's output is checked in: regenerate it, and fail on any difference.
          go -C graphql tool gqlgen generate
          git diff --exit-code HEAD -- graphql/graph
          test -z "$(git ls-files --others --exclude-standard -- graphql/graph)"
      # bench/scale's GraphQL tests, which the test job leaves out: they
      # need no database.
      - name: root's GraphQL tests
        run: go test -race -count=1 -timeout 20m -coverpkg=./... -coverprofile=cover-root-graphql.out -run '^(TestGraphQLServiceLinksOnlyItsEntities|TestScaleHarnessSmallGraphQL)$' ./bench/scale
      - name: scale (n=500, GraphQL, report-only)
        run: scripts/scale-check.sh -n 500 -s 100 -graphql
  # velox-graphql against the newest gqlgen. A red job says gqlgen moved.
  gqlgen-latest:
    needs: changes
    if: needs.changes.outputs.graphql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - run: scripts/gqlgen-latest.sh
  # contrib/veloxotel's checks.
  otel:
    needs: changes
    if: needs.changes.outputs.otel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      - name: contrib/veloxotel
        working-directory: contrib/veloxotel
        run: |
          go mod tidy -diff
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
  # bench/compare's checks (the measurements run only from run.sh), velox's
  # case of its generation test, and the benchmarks against the committed
  # baselines.
  bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the job's own cache, below
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      # TestGenerateCompiles builds velox-gen and a generated app offline: it
      # needs the root's whole module graph, as the scale job does.
      - run: |
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
      - name: bench/compare
        working-directory: bench/compare
        run: |
          go mod tidy -diff
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
          go test -race -short -count=1 ./...
          # -short skips TestGenerateCompiles; its velox case runs here.
          go mod download all
          go mod tidy # download all adds to go.sum what tidy leaves out
          go test -count=1 -run '^TestGenerateCompiles$/^velox$' .
      # Report-only: the baselines in bench/baseline come from other hardware, so
      # the time deltas are informational. Allocation counts are enforced by the
      # budget tests.
      - name: benchmarks against the committed baselines (report-only)
        run: scripts/bench-compare.sh
