# The vocabulary of velox's GraphQL types: the scalars, PageInfo and
# OrderDirection, bound to Go by contrib/graphql/veloxgql, and gqlgen's @goField
# and @goModel, as gqlgen documents them.

"""A time, as an RFC 3339 string."""
scalar Time @goModel(model: "time.Time")

"""Bytes, as a base64 string."""
scalar Bytes @goModel(model: "[]byte")

"""An opaque cursor for paging through a connection."""
scalar Cursor @goModel(model: "github.com/syssam/velox/contrib/graphql/veloxgql.Cursor")

directive @goField(forceResolver: Boolean, name: String, omittable: Boolean, type: String, maxList: Int) on INPUT_FIELD_DEFINITION | FIELD_DEFINITION

directive @goModel(model: String, models: [String!], forceGenerate: Boolean) on OBJECT | INPUT_OBJECT | SCALAR | ENUM | INTERFACE | UNION

"""Information about a page of a connection."""
type PageInfo @goModel(model: "github.com/syssam/velox/contrib/graphql/veloxgql.PageInfo") {
  """Whether there are more nodes after this page."""
  hasNextPage: Boolean!
  """Whether there are more nodes before this page."""
  hasPreviousPage: Boolean!
  """The cursor of the first node of the page."""
  startCursor: Cursor
  """The cursor of the last node of the page."""
  endCursor: Cursor
}

"""The direction of an order."""
enum OrderDirection @goModel(model: "github.com/syssam/velox/contrib/graphql/veloxgql.OrderDirection") {
  ASC
  DESC
}

"""
An object with an ID.
Follows the [Relay Global Object Identification Specification](https://relay.dev/graphql/objectidentification.htm)
"""
interface Node @goModel(model: "example.com/app/gen.Noder") {
  """The id of the object."""
  id: ID!
}

# The root query.

type Query {
  """Fetches an object given its ID."""
  node(id: ID!): Node
  """Lookup nodes by a list of IDs."""
  nodes(ids: [ID!]!): [Node]!
  """The Category nodes, as the application's resolver returns them."""
  categories: [Category!]!
  """The Group nodes, as the application's resolver returns them."""
  groups: [Group!]!
  """The connection to the Like nodes, ordered by orderBy and then the key, and paged by the other arguments."""
  likes(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: LikeOrder): LikeConnection!
  """The Post nodes, as the application's resolver returns them."""
  posts: [Post!]!
  """The Account nodes, as the application's resolver returns them."""
  accounts: [Account!]!
}

# Category

"""A category of posts, in a tree."""
type Category implements Node @goModel(model: "example.com/app/gen.Category") {
  id: ID!
  title: String!
  """The subcategories."""
  children: [Category!]!
  parent: Category
}

"""Filters Category nodes: a node matches when every predicate given holds."""
input CategoryWhereInput @goModel(model: "example.com/app/gen.CategoryWhereInput") {
  not: CategoryWhereInput
  and: [CategoryWhereInput!]
  or: [CategoryWhereInput!]
  id: ID
  idNEQ: ID
  idIn: [ID!]
  idNotIn: [ID!]
  hasParent: Boolean
  hasParentWith: [CategoryWhereInput!]
}

"""The input that creates a Category."""
input CreateCategoryInput @goModel(model: "example.com/app/gen.CreateCategoryInput") {
  title: String!
  """The IDs of the Category nodes the edge children leads to."""
  childIDs: [ID!]
  """The ID of the Category the edge parent leads to."""
  categoryChildren: ID
}

"""The input that updates a Category: a field not given is left as it is."""
input UpdateCategoryInput @goModel(model: "example.com/app/gen.UpdateCategoryInput") {
  title: String
  """The IDs of Category nodes to add to the edge children."""
  addChildIDs: [ID!]
  """The IDs of Category nodes to remove from the edge children; an ID the edge does not lead to is ignored."""
  removeChildIDs: [ID!]
  """Removes every Category from the edge children, before the IDs to remove and to add."""
  clearChildren: Boolean
  """The ID of the Category the edge parent leads to."""
  categoryChildren: ID
  """Unlinks the edge parent: it leads to no Category afterwards."""
  clearParent: Boolean
}

# Group

type Group implements Node @goModel(model: "example.com/app/gen.Group") {
  id: ID!
  name: String!
  """Who can see the group; a String, as its enum is skipped."""
  visibility: String!
  users: [Account!]!
}

# Like

"""A user's like of a post. Its key is two columns, so it has no ID."""
type Like @goModel(model: "example.com/app/gen.Like") {
  userId: ID!
  postId: ID!
  weight: Int
  createdAt: Time!
  user: Account!
  post: Post!
}

"""A connection to a list of Like."""
type LikeConnection @goModel(model: "example.com/app/gen.LikeConnection") {
  """The edges of this page."""
  edges: [LikeEdge!]
  """Information about this page."""
  pageInfo: PageInfo!
  """The number of nodes in the whole connection, not only on this page."""
  totalCount: Int!
}

"""An edge in a connection to a list of Like."""
type LikeEdge @goModel(model: "example.com/app/gen.LikeEdge") {
  """The Like at the end of the edge."""
  node: Like
  """The cursor of this edge, for paging."""
  cursor: Cursor!
}

"""Ordering options for connections to Like."""
input LikeOrder @goModel(model: "example.com/app/gen.LikeOrder") {
  """The direction of the order."""
  direction: OrderDirection! = ASC
  """The field to order by."""
  field: LikeOrderField!
}

"""The fields connections to Like can be ordered by."""
enum LikeOrderField @goModel(model: "example.com/app/gen.LikeOrderField") {
  USER_ID
  POST_ID
  CREATED_AT
}

"""The input that creates a Like."""
input CreateLikeInput @goModel(model: "example.com/app/gen.CreateLikeInput") {
  weight: Int
  createdAt: Time
  """The ID of the Account the edge user leads to."""
  userId: ID!
  """The ID of the Post the edge post leads to."""
  postId: ID!
}

# Post

type Post implements Node @goModel(model: "example.com/app/gen.Post") {
  id: ID!
  authorId: ID!
  title: String!
  slug: String!
  status: PostStatus!
  publishedAt: Time
  tags: [String!]!
  views: Int!
  rating: Float
  """Who last edited the post; the update default fills it."""
  editedBy: String!
  """The user who wrote the post."""
  author: Account!
  likes: [Like!]!
  """Posts this post links to; a join of Post to itself."""
  related: [Post!]!
  relatedBy: [Post!]!
}

enum PostStatus @goModel(model: "example.com/app/gen.PostStatus") {
  DRAFT
  IN_REVIEW
  LIVE
}

"""Filters Post nodes: a node matches when every predicate given holds."""
input PostWhereInput @goModel(model: "example.com/app/gen.PostWhereInput") {
  not: PostWhereInput
  and: [PostWhereInput!]
  or: [PostWhereInput!]
  id: ID
  idNEQ: ID
  idIn: [ID!]
  idNotIn: [ID!]
  authorId: ID
  authorIdNEQ: ID
  authorIdIn: [ID!]
  authorIdNotIn: [ID!]
  title: String
  titleNEQ: String
  titleIn: [String!]
  titleNotIn: [String!]
  titleContains: String
  titleHasPrefix: String
  titleHasSuffix: String
  titleEqualFold: String
  titleContainsFold: String
  slug: String
  slugNEQ: String
  slugIn: [String!]
  slugNotIn: [String!]
  status: PostStatus
  statusNEQ: PostStatus
  statusIn: [PostStatus!]
  statusNotIn: [PostStatus!]
  publishedAt: Time
  publishedAtNEQ: Time
  publishedAtIn: [Time!]
  publishedAtNotIn: [Time!]
  publishedAtGT: Time
  publishedAtGTE: Time
  publishedAtLT: Time
  publishedAtLTE: Time
  publishedAtIsNil: Boolean
  publishedAtNotNil: Boolean
  hasAuthor: Boolean
  hasAuthorWith: [AccountWhereInput!]
}

"""The input that creates a Post."""
input CreatePostInput @goModel(model: "example.com/app/gen.CreatePostInput") {
  title: String!
  slug: String!
  status: PostStatus
  publishedAt: Time
  tags: [String!]
  rating: Float
  """Who last edited the post; the update default fills it."""
  editedBy: String!
  """The ID of the Account the edge author leads to."""
  authorId: ID!
  """The IDs of the Post nodes the edge related leads to."""
  relatedIDs: [ID!]
  """The IDs of the Post nodes the edge related_by leads to."""
  relatedByIDs: [ID!]
}

"""The input that updates a Post: a field not given is left as it is."""
input UpdatePostInput @goModel(model: "example.com/app/gen.UpdatePostInput") {
  title: String
  status: PostStatus
  publishedAt: Time
  """Sets the field published_at to NULL."""
  clearPublishedAt: Boolean
  tags: [String!]
  views: Int
  rating: Float
  """Sets the field rating to NULL."""
  clearRating: Boolean
  """The ID of the Account the edge author leads to."""
  authorId: ID
  """The IDs of Post nodes to add to the edge related."""
  addRelatedIDs: [ID!]
  """The IDs of Post nodes to remove from the edge related; an ID the edge does not lead to is ignored."""
  removeRelatedIDs: [ID!]
  """Removes every Post from the edge related, before the IDs to remove and to add."""
  clearRelated: Boolean
  """The IDs of Post nodes to add to the edge related_by."""
  addRelatedByIDs: [ID!]
  """The IDs of Post nodes to remove from the edge related_by; an ID the edge does not lead to is ignored."""
  removeRelatedByIDs: [ID!]
  """Removes every Post from the edge related_by, before the IDs to remove and to add."""
  clearRelatedBy: Boolean
}

# User, as the type Account

"""
User is a person who writes posts.
Its GraphQL type is Account.
"""
type Account implements Node @goModel(model: "example.com/app/gen.User") {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  """The display name."""
  name: String!
  email: String!
  role: UserRole!
  nickname: String @deprecated(reason: "Use \"displayName\".")
  bio: String
  age: Int
  score: Float
  externalId: UUID!
  avatar: Bytes
  quota: Uint64!
  active: Boolean
  settings: JSON @goField(forceResolver: true)
  """The posts the user wrote."""
  posts: [Post!]! @cost(meta: {cached: true, ttl: null}, tags: ["list", "paged"], weight: 2.5)
  groups: [Group!]!
  likes(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: LikeOrder): LikeConnection!
}

enum UserRole @goModel(model: "example.com/app/gen.UserRole") {
  ADMIN
  EDITOR
  VIEWER
}

"""Filters Account nodes: a node matches when every predicate given holds."""
input AccountWhereInput @goModel(model: "example.com/app/gen.AccountWhereInput") {
  not: AccountWhereInput
  and: [AccountWhereInput!]
  or: [AccountWhereInput!]
  id: ID
  idNEQ: ID
  idIn: [ID!]
  idNotIn: [ID!]
  name: String
  nameNEQ: String
  nameIn: [String!]
  nameNotIn: [String!]
  nameContains: String
  nameHasPrefix: String
  nameHasSuffix: String
  hasPosts: Boolean
  hasPostsWith: [PostWhereInput!]
}

"""The input that creates an Account."""
input CreateAccountInput @goModel(model: "example.com/app/gen.CreateAccountInput") {
  createdAt: Time
  updatedAt: Time
  """The display name."""
  name: String!
  email: String!
  role: UserRole
  nickname: String
  bio: String
  age: Int
  passwordHash: String!
  score: Float
  externalId: UUID
  avatar: Bytes
  quota: Uint64!
  active: Boolean
  settings: JSON
  """The IDs of the Group nodes the edge groups leads to."""
  groupIDs: [ID!]
  """The ID of the Account the edge best_friend leads to."""
  userBestFriend: ID
}
