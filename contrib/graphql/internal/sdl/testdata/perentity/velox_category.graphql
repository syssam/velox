# Category

"""A category of posts, in a tree."""
type Category {
  id: ID!
  title: String!
  """The subcategories."""
  children(after: Cursor, first: Int, before: Cursor, last: Int, where: CategoryWhereInput): CategoryConnection!
  parent: Category
}

"""A connection to a list of Category."""
type CategoryConnection {
  """The edges of this page."""
  edges: [CategoryEdge!]!
  """Information about this page."""
  pageInfo: PageInfo!
  """The number of nodes in the whole connection, not only on this page."""
  totalCount: Int!
}

"""An edge in a connection to a list of Category."""
type CategoryEdge {
  """The Category at the end of the edge."""
  node: Category!
  """The cursor of this edge, for paging."""
  cursor: Cursor!
}

"""Filters Category nodes: a node matches when every predicate given holds."""
input CategoryWhereInput {
  not: CategoryWhereInput
  and: [CategoryWhereInput!]
  or: [CategoryWhereInput!]
  id: ID
  idNEQ: ID
  idIn: [ID!]
  idNotIn: [ID!]
  idGT: ID
  idGTE: ID
  idLT: ID
  idLTE: ID
  hasParent: Boolean
  hasParentWith: [CategoryWhereInput!]
}

"""The input that creates a Category."""
input CreateCategoryInput {
  title: String!
  """The IDs of the Category nodes the edge children leads to."""
  childIDs: [ID!]
  """The ID of the Category the edge parent leads to."""
  parentID: ID
}

"""The input that updates a Category: a field not given is left as it is."""
input UpdateCategoryInput {
  title: String
  """The IDs of Category nodes to add to the edge children."""
  addChildIDs: [ID!]
  """The IDs of Category nodes to remove from the edge children; an ID the edge does not lead to is ignored."""
  removeChildIDs: [ID!]
  """Removes every Category from the edge children, before the IDs to remove and to add."""
  clearChildren: Boolean
  """The ID of the Category the edge parent leads to."""
  parentID: ID
  """Unlinks the edge parent: it leads to no Category afterwards."""
  clearParent: Boolean
}
