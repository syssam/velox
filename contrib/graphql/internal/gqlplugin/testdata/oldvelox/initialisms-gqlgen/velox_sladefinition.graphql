# SLADefinition

type SLADefinition implements Node {
  id: ID!
  name: String!
  devices(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: DeviceOrder, where: DeviceWhereInput): DeviceConnection!
}

"""A connection to a list of SLADefinition."""
type SLADefinitionConnection {
  """The edges of this page."""
  edges: [SLADefinitionEdge!]
  """Information about this page."""
  pageInfo: PageInfo!
  """The number of nodes in the whole connection, not only on this page."""
  totalCount: Int!
}

"""An edge in a connection to a list of SLADefinition."""
type SLADefinitionEdge {
  """The SLADefinition at the end of the edge."""
  node: SLADefinition
  """The cursor of this edge, for paging."""
  cursor: Cursor!
}

"""Ordering options for connections to SLADefinition."""
input SLADefinitionOrder {
  """The direction of the order."""
  direction: OrderDirection! = ASC
  """The field to order by."""
  field: SLADefinitionOrderField!
}

"""The fields connections to SLADefinition can be ordered by."""
enum SLADefinitionOrderField {
  NAME
}

"""Filters SLADefinition nodes: a node matches when every predicate given holds."""
input SLADefinitionWhereInput {
  not: SLADefinitionWhereInput
  and: [SLADefinitionWhereInput!]
  or: [SLADefinitionWhereInput!]
  id: ID
  idNEQ: ID
  idIn: [ID!]
  idNotIn: [ID!]
  name: String
  nameNEQ: String
  nameIn: [String!]
  nameNotIn: [String!]
  nameContains: String
  nameHasPrefix: String
  nameHasSuffix: String
  nameEqualFold: String
  nameContainsFold: String
}

"""The input that creates a SLADefinition."""
input CreateSLADefinitionInput {
  name: String!
  """The IDs of the Device nodes the edge devices leads to."""
  deviceIDs: [ID!]
}

"""The input that updates a SLADefinition: a field not given is left as it is."""
input UpdateSLADefinitionInput {
  name: String
  """The IDs of Device nodes to add to the edge devices."""
  addDeviceIDs: [ID!]
  """The IDs of Device nodes to remove from the edge devices; an ID the edge does not lead to is ignored."""
  removeDeviceIDs: [ID!]
  """Removes every Device from the edge devices, before the IDs to remove and to add."""
  clearDevices: Boolean
}
