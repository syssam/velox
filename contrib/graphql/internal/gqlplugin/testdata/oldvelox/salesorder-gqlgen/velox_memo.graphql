# Memo

type Memo implements Node {
  id: ID!
  title: String!
}

"""A connection to a list of Memo."""
type MemoConnection {
  """The edges of this page."""
  edges: [MemoEdge!]
  """Information about this page."""
  pageInfo: PageInfo!
  """The number of nodes in the whole connection, not only on this page."""
  totalCount: Int!
}

"""An edge in a connection to a list of Memo."""
type MemoEdge {
  """The Memo at the end of the edge."""
  node: Memo
  """The cursor of this edge, for paging."""
  cursor: Cursor!
}

"""Ordering options for connections to Memo."""
input MemoOrder {
  """The direction of the order."""
  direction: OrderDirection! = ASC
  """The field to order by."""
  field: MemoOrderField!
}

"""The fields connections to Memo can be ordered by."""
enum MemoOrderField {
  TITLE
}
