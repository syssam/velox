# gqlgen's configuration: go tool gqlgen generate, run in this directory,
# reads it and writes graph/.
#
# The GraphQL schema is velox-graphql's gen/velox.graphqls plus the
# application's own files in graph/ (app.graphqls adds publishedPosts).
schema:
  - gen/*.graphqls
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

# Every type of the schema but Query binds to Go that exists, so the models
# file holds only gqlgen's empty Query struct.
model:
  filename: graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: schema.resolvers.go

# The generated package holds the Go of every entity, connection, edge, order
# and where type, named as in the schema.
autobind:
  - github.com/syssam/velox2/examples/graphql/gen

# Node and the scalars bind to veloxgql. A scalar lists one model for each Go
# type velox entities hold, since gqlgen binds a field only to a model of its
# own Go type (contrib/graphql's package documentation).
models:
  Node:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.Noder
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int8
      - github.com/99designs/gqlgen/graphql.Int16
      - github.com/99designs/gqlgen/graphql.Int32
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Uint8
      - github.com/99designs/gqlgen/graphql.Uint16
      - github.com/99designs/gqlgen/graphql.Uint32
  Float:
    model:
      - github.com/99designs/gqlgen/graphql.FloatContext
      - github.com/syssam/velox2/contrib/graphql/veloxgql.Float32
  Uint64:
    model:
      - github.com/syssam/velox2/contrib/graphql/veloxgql.Uint64
      - github.com/syssam/velox2/contrib/graphql/veloxgql.Uint
  Time:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.Time
  UUID:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.UUID
  Bytes:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.Bytes
  JSON:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.JSON
  Cursor:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.Cursor
  OrderDirection:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.OrderDirection
  PageInfo:
    model: github.com/syssam/velox2/contrib/graphql/veloxgql.PageInfo
