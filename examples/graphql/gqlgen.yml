# gqlgen's configuration: go tool gqlgen generate, run in this directory,
# reads it and writes graph/.
#
# The GraphQL schema is velox-graphql's veloxgen/velox.graphql plus the
# application's own files in graph/ (app.graphql adds publishedPosts).
schema:
  - veloxgen/*.graphql
  - graph/*.graphql

exec:
  filename: graph/generated.go
  package: graph

# Every type of the schema but Query binds to Go that exists, so the models
# file holds only gqlgen's empty Query struct.
model:
  filename: graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: schema.resolvers.go

# The generated package holds the Go of every entity, connection, edge, order
# and where type, named as in the schema.
autobind:
  - github.com/syssam/velox/examples/graphql/veloxgen

# ID and the scalars bind to veloxgql and gqlgenx, its gqlgen adapter. An ID is the entity's key, an int64
# here: gqlgen binds every ID argument to ID's first model, and Int64ID reads
# an integer or a string of one and writes a string. A scalar lists one model
# for each Go type velox entities hold, since gqlgen binds a field only to a
# model of its own Go type (contrib/graphql's package documentation).
models:
  ID:
    model: github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.Int64ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int8
      - github.com/99designs/gqlgen/graphql.Int16
      - github.com/99designs/gqlgen/graphql.Int32
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Uint8
      - github.com/99designs/gqlgen/graphql.Uint16
      - github.com/99designs/gqlgen/graphql.Uint32
  Float:
    model:
      - github.com/99designs/gqlgen/graphql.FloatContext
      - github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.Float32
  Uint64:
    model:
      - github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.Uint64
      - github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.Uint
  Time:
    model: github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.Time
  UUID:
    model: github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.UUID
  Bytes:
    model: github.com/syssam/velox/contrib/graphql/veloxgql/gqlgenx.Bytes
  JSON:
    model: github.com/syssam/velox/contrib/graphql/veloxgql.JSON
  Cursor:
    model: github.com/syssam/velox/contrib/graphql/veloxgql.Cursor
  OrderDirection:
    model: github.com/syssam/velox/contrib/graphql/veloxgql.OrderDirection
  PageInfo:
    model: github.com/syssam/velox/contrib/graphql/veloxgql.PageInfo
