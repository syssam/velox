"""
Restricts a field to admins. main.go implements it from the X-Role header.
velox-graphql puts it on User.email; the application, on the mutations that
manage users.
"""
directive @admin on FIELD_DEFINITION

"""
The mutations, which the application declares: velox-graphql writes their
inputs, and each resolver, in schema.resolvers.go, calls the input's Create or
Update. createPost's author is the viewer, the user X-User names, who alone
may update or delete the post; deletePost is the application's own.
"""
type Mutation {
  "Creates a post by the viewer."
  createPost(input: CreatePostInput!): Post!
  "Updates the viewer's post with this ID: only the fields given change."
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  "Deletes the viewer's post with this ID, and returns the ID."
  deletePost(id: ID!): ID!
  "Creates a label."
  createLabel(input: CreateLabelInput!): Label!
  "Updates the label with this ID: only the fields given change."
  updateLabel(id: ID!, input: UpdateLabelInput!): Label!
  "Creates a user with this password, which the server hashes; admins only."
  createUser(input: CreateUserInput!, password: String!): User! @admin
  """
  Updates the user with this ID: only the fields given change, the password
  too when it is given.
  """
  updateUser(id: ID!, input: UpdateUserInput!, password: String): User! @admin
}

extend type Query {
  """
  The published posts, composed by the application from its own query with
  a query's Paginate: paged, ordered and filtered as the posts connection
  is.
  """
  publishedPosts(
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: [PostOrder!]
    where: PostWhereInput
  ): PostConnection!
}

# The application's own field on a generated type, resolved by graph's
# userResolver from the user's name. velox-graphql did not write it, so it
# cannot know which columns its resolver reads: a page that selects it reads
# every column.
extend type User {
  "The initials of the user's name."
  initials: String!
}
