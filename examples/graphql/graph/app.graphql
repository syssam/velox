"""
Restricts a field to admins, and its where predicates and mutation input
fields too, since velox-graphql copies a field's directives onto them. main.go
implements it from the X-Role header. It is declared on input fields as well
as fields, or gqlgen refuses the schema.
"""
directive @admin on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
The mutations, which the application declares: velox-graphql writes their
inputs, and each resolver, in schema.resolvers.go, calls the input's Create or
Update. createPost's author is the viewer, the user X-User names; deletePost is
the application's own.
"""
type Mutation {
  "Creates a post by the viewer."
  createPost(input: CreatePostInput!): Post!
  "Updates the post with this ID: only the fields given change."
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  "Deletes the post with this ID, and returns the ID."
  deletePost(id: ID!): ID!
  "Creates a label."
  createLabel(input: CreateLabelInput!): Label!
  "Updates the label with this ID: only the fields given change."
  updateLabel(id: ID!, input: UpdateLabelInput!): Label!
  "Creates a user."
  createUser(input: CreateUserInput!): User!
  "Updates the user with this ID: only the fields given change."
  updateUser(id: ID!, input: UpdateUserInput!): User!
}

extend type Query {
  """
  The published posts, composed by the application from its own query with
  gen.PostsConnectionOf: paged, ordered and filtered as the posts connection
  is.
  """
  publishedPosts(
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: [PostOrder!]
    where: PostWhereInput
  ): PostConnection!
}

# The application's own field on a generated type, resolved by graph's
# userResolver from the user's name. velox-graphql did not write it, so it
# cannot know which columns its resolver reads: a page that selects it reads
# every column.
extend type User {
  "The initials of the user's name."
  initials: String!
}
