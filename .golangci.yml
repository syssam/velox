version: "2"
linters:
  default: standard
  enable: [revive, errname]
  exclusions:
    generated: disable
    rules:
      # gqlgen's output, which velox2 does not write and CI regenerates and diffs.
      - path: ^example/graphql/graph/generated\.go$
        linters: [staticcheck]
      # The engine's exports are for the root package; its public types are documented
      # on their aliases in api.go, which TestAliasDocsListMembers checks, or in dbtype.
      - path: ^internal/engine/
        linters: [revive]
        text: "^exported:"
      - path: ^internal/engine/
        linters: [staticcheck]
        text: ST102
      - path: ^internal/engine/
        linters: [revive]
        text: "^unexported-return:"
      # Test entities, exported only because two test packages share them.
      - path: ^internal/apitest/fixture/
        linters: [revive]
      - path: ^internal/apitest/fixture/
        linters: [staticcheck]
        text: ST102
  settings:
    staticcheck:
      # All, which is the default plus ST1003, ST1016, ST1020, ST1021 and ST1022;
      # ST1000 is revive's package-comments.
      checks: ["all", "-ST1000"]
    revive:
      # scripts/revive.toml must mirror these rules: CI runs revive with it on generated
      # code, which golangci-lint's revive skips. TestReviveConfigsAgree checks it.
      rules:
        - name: var-naming
        - name: exported
          arguments: ["sayRepetitiveInsteadOfStutters"]
        - name: receiver-naming
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: context-as-argument
          arguments: [{allowTypesBefore: "*testing.T,testing.TB"}]
        - name: context-keys-type
        - name: unexported-return
        - name: redefines-builtin-id
        - name: package-comments
        - name: time-naming
        - name: increment-decrement
        - name: blank-imports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
