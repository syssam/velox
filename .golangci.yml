version: "2"
linters:
  default: standard
  enable: [revive, errname, modernize, intrange, wastedassign, misspell, nilerr, unconvert, usestdlibvars, bodyclose, gocognit, unparam, rowserrcheck, sqlclosecheck, errorlint, noctx]
  exclusions:
    generated: disable
    rules:
      # gqlgen's output, which velox does not write and CI regenerates and diffs.
      - path: ^examples/graphql/graph/generated\.go$
        linters: [staticcheck, modernize, gocognit]
      # A test reads top to bottom, and a test helper may take a parameter
      # every caller happens to pass alike.
      - path: _test\.go$
        linters: [gocognit, unparam]
      # A test's statements need no caller's context, and a test may require
      # an error itself, not one that wraps it.
      - path: _test\.go$
        linters: [noctx, errorlint]
      # The DB linters' findings in packages that other work is changing,
      # left for that work: errorlint's in internal/engine (7),
      # internal/codegen (4), migrate (4), cmd/velox-gen (2),
      # internal/genrun (2) and contrib/graphql (12), and rowserrcheck's and sqlclosecheck's in
      # migrate/guard.go (2) and seven of migrate's tests (9). Remove a file
      # from these lists once it passes.
      - path: ^(internal/engine/(hook|insert|scope|sqlitefk|write)|internal/codegen/(behaviourcheck|load)|migrate/(dir|file|session)|cmd/velox-gen/(generate|migrate_db)|internal/genrun/rel)\.go$
        linters: [errorlint]
      - path: ^contrib/graphql/(internal/sdl/fields|veloxgql/(gqlgenx/presenter|gqlgraph/input|graphqlgo/presenter|internal/gqlcore/(error|errwalk)))\.go$
        linters: [errorlint]
      - path: ^migrate/(guard|guard_sqlite_test|rows_test|inspect_sqlite_test|render_postgres_test|render_test|runner_db_test|stepwise_db_test)\.go$
        linters: [rowserrcheck, sqlclosecheck]
      # The SQL lexers are state machines: one switch over the next byte,
      # which splitting would scatter.
      - path: ^migrate/(split|predicate|inspect_sqlite_create)\.go$
        linters: [gocognit]
        text: "func `(lex|lexPredicate|lexSQL)`"
      # The engine's exports are for the root package; its public types are documented
      # on their aliases in the root, which TestAliasDocsListMembers checks, or in veloxtype.
      # Each of these is documented where it is declared, in veloxtype. Revive checks a
      # group's comment against each name, which one sentence cannot satisfy.
      - path: ^internal/engine/veloxtype\.go$
        linters: [revive]
        text: "^exported:"
      - path: ^internal/engine/
        linters: [staticcheck]
        text: ST102
      - path: ^internal/engine/
        linters: [revive]
        text: "^unexported-return:"
      # Test entities, exported only because two test packages share them.
      - path: ^internal/apitest/fixture/
        linters: [revive]
      - path: ^internal/apitest/fixture/
        linters: [staticcheck]
        text: ST102
  settings:
    gocognit:
      # A function over this is split into helpers that each do one job.
      min-complexity: 40
    misspell:
      # velox-gen's did-you-mean tests spell it wrong on purpose.
      ignore-rules: [nmae]
    staticcheck:
      # All, which is the default plus ST1003, ST1016, ST1020, ST1021 and ST1022;
      # ST1000 is revive's package-comments.
      checks: ["all", "-ST1000"]
    revive:
      # scripts/revive.toml must mirror these rules: CI runs revive with it on generated
      # code, which golangci-lint's revive skips. TestReviveConfigsAgree checks it.
      rules:
        - name: var-naming
        - name: exported
          arguments: ["sayRepetitiveInsteadOfStutters"]
        - name: receiver-naming
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: context-as-argument
          arguments: [{allowTypesBefore: "*testing.T,testing.TB"}]
        - name: context-keys-type
        - name: unexported-return
        - name: redefines-builtin-id
        - name: package-comments
        - name: time-naming
        - name: increment-decrement
        - name: blank-imports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
